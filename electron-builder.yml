appId: com.alike.reports
productName: Alike Analytica
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist_electron
  # Builder will also look here for installer icons
  buildResources: electron/assets/icons

files:
  - dist/**
  - electron/**
  - package.json

npmRebuild: false
asar: true

extraResources:
  - from: electron/assets/icons
    to: assets/icons
    filter:
      - "**/*"

  - from: scripts
    to: scripts
    filter:
      - "**/*"

  - from: seeds/website_downloads_db.json
    to: seeds/website_downloads_db.json

win:
  icon: electron/assets/icons/icon.ico
  target:
    - nsis
  # - portable   # (optional)

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

mac:
  icon: electron/assets/icons/icon.icns
  target:
    - dmg
  category: public.app-category.productivity

linux:
  icon: electron/assets/icons
  target:
    - AppImage
    - deb
  category: Utility

publish:
  provider: github
  owner: AnushkaSandeepa
  repo: alike_reports_fe
