appId: com.alike.reports
productName: Alike Reports betaV
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist_electron
  buildResources: build

files:
  - dist/**
  - electron/**
  - package.json

npmRebuild: false


asar: true

extraResources:
  - from: scripts           # your Python or helper scripts
    to: scripts
    filter:
      - "**/*"
    filter:
      - "slo_processor.py"

  - from: seeds/website_downloads_db.json
    to: seeds/website_downloads_db.json

win:
  target:
    - nsis
  # For a no-installer “portable” build, add: - portable

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  category: Utility

# ⚠️ GitHub publishing
publish:
  provider: github
  owner: AnushkaSandeepa
  repo: alike_reports_fe
