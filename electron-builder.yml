appId: com.alike.reports
productName: Alike Reports (Sample)
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

files:
  - "electron/**"
  - "dist/renderer/**"     # Vite renderer output
  - "!node_modules/*/{test,__tests__}/**"
  - "!**/*.map"

npmRebuild: false

asar: true

extraResources:
  - from: scripts           # your Python or helper scripts
    to: scripts
    filter:
      - "**/*"

win:
  target:
    - nsis
  # For a no-installer “portable” build, add: - portable

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  category: Utility
